<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStart Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>TechStart Application Form</h1>
        <p>You can apply to TechStart by filling the below form</p>
    </header>
    <main>
        <div class="container">
            <form action="/submit-application" method="get">
                <fieldset>
                    <legend>Personal Information</legend>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="firstname">First Name:</label>
                            <input required type="text" id="firstname" name="firstname"
                                placeholder="Enter your first name">
                        </div>

                        <div class="form-group">
                            <label for="lastname">Last Name:</label>
                            <input required type="text" id="lastname" name="lastname"
                                placeholder="Enter your last name">
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="doe">Date of Birth:</label>
                            <input required type="date" id="doe" name="doe">
                        </div>

                        <div class="form-group gender-group">
                            <label for="gender">Gender:</label>

                            <div class="gender-options">
                                <input required type="radio" id="male" name="gender" value="male">
                                <label for="male">Male</label>

                                <input required type="radio" id="female" name="gender" value="female">
                                <label for="female">Female</label>
                            </div>

                        </div>

                    </div>

                </fieldset>

                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input required type="email" id="email" name="email" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone:</label>
                            <input required type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="street-Address">Street Address:</label>
                            <input type="text" id="street-Address" name="street-Address"
                                placeholder="Enter your street address">
                        </div>
                        <div class="form-group">
                            <label for="city">City:</label>
                            <input required type="text" id="city" name="city" placeholder="Enter your city">
                        </div>

                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="state">Select a State:</label>
                            <select required id="state" name="state">
                                <option value="">-- Select a State --</option>
                                <option value="CA">California</option>
                                <option value="NY">New York</option>
                                <option value="TX">Texas</option>
                                <option value="LA">los Angeles</option>
                                <option value="NJ">New Jersey</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="zip">Zip Code:</label>
                            <input type="text" id="zip" name="zip" placeholder="Enter your zip code">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="country">Country:</label>
                            <select required id="country" name="country">
                                <option value="">-- Select a Country --</option>
                                <option value="US">United States</option>
                                <option value="CA">Canada</option>
                                <option value="LB">Lebanon</option>
                                <option value="Sa">Saudi Arabia</option>
                                <option value="UK">United Kingdom</option>
                            </select>
                        </div>
                        <div class="form-group">

                        </div>
                    </div>
                </fieldset>


                <fieldset>
                    <legend>Position And Experience</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="position">Position Apllying For</label>
                            <select required name="position" id="position">
                                <option value="">-- Select a Position --</option>
                                <option value="software-developer">Software Developer</option>
                                <option value="web-developer">Web Developer</option>
                                <option value="data-analyst">Data Analyst</option>
                                <option value="ui-ux-designer">UI/Ux Designer</option>
                                <option value="project-manager">Project Manager</option>
                                <option value="marketing-specialist">Marketing Specialist</option>
                                <option value="other">Other</option>

                            </select>
                        </div>
                        <div class="form-group department-group">
                            <div class="radio-group" id="experience">
                                <label>Department preference:</label>

                                <input type="radio" id="engineering" name="department" value="Engineering">
                                <label for="engineering">Engineering</label>

                                <input type="radio" id="design" name="department" value="Design">
                                <label for="design">Design</label>

                                <input type="radio" id="marketing" name="department" value="Marketing">
                                <label for="marketing">Marketing</label>

                                <input type="radio" id="sales" name="department" value="Sales">
                                <label for="sales">Sales</label>

                                <input type="radio" id="operations" name="department" value="Operations">
                                <label for="operations">Operations</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group experience-group">

                            <label>Experience level:</label>

                            <div class="experience-options">

                                <input type="radio" id="entry" name="experience" value="Entry Level">
                                <label for="entry">Entry Level (0-2 years)</label>

                                <input type="radio" id="mid" name="experience" value="Mid Level">
                                <label for="mid">Mid Level (3-5 years)</label>

                                <input type="radio" id="senior" name="experience" value="Senior Level">
                                <label for="senior">Senior Level (6-10 years)</label>

                                <input type="radio" id="lead" name="experience" value="Lead/Manager">
                                <label for="lead">Lead/Manager (10+ years)</label>

                            </div>

                        </div>
                        <div class="form-group">
                            <label for="status">Current employment status:</label>

                            <select id="status" name="status">
                                <option value="">-- Select Status --</option>
                                <option value="Employed">Employed</option>
                                <option value="Unemployed">Unemployed</option>
                                <option value="Student">Student</option>
                                <option value="Freelancer">Freelancer</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Availability & Preferences</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startdate">Earliest start date:</label>
                            <input required type="date" id="startdate" name="startdate">
                        </div>
                        <div class="form-group">
                            <div class="radio-group">
                                <label>Work preference:</label>
                                <input type="radio" id="fulltime" name="work" value="Full-time">
                                <label for="fulltime">Full-time</label>

                                <input type="radio" id="parttime" name="work" value="Part-time">
                                <label for="parttime">Part-time</label>
                                <input type="radio" id="contract" name="work" value="Contract">
                                <label for="contract">Contract</label>

                                <input type="radio" id="internship" name="work" value="Internship">
                                <label for="internship">Internship</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="radio-group">
                                <label>Remote work preference:</label>
                                <input type="radio" id="remote" name="remote" value="Fully remote">
                                <label for="remote">Fully remote</label>

                                <input type="radio" id="hybrid" name="remote" value="Hybrid">
                                <label for="hybrid">Hybrid (2-3 days in office)</label>

                                <input type="radio" id="office" name="remote" value="Fully in-office">
                                <label for="office">Fully in-office</label>

                                <input type="radio" id="nopref" name="remote" value="No preference">
                                <label for="nopref">No preference</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="radio-group">
                                <label>Willing to relocate?</label>

                                <input type="radio" id="yes" name="relocate" value="Yes">
                                <label for="yes">Yes</label>

                                <input type="radio" id="no" name="relocate" value="No">
                                <label for="no">No</label>

                                <input type="radio" id="maybe" name="relocate" value="Maybe">
                                <label for="maybe">Maybe</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="salary">Expected salary range:</label>
                            <select id="salary" name="salary">
                                <option value="">-- Select Salary Range --</option>
                                <option>$30,000 - $40,000</option>
                                <option>$40,000 - $55,000</option>
                                <option>$55,000 - $70,000</option>
                                <option>$70,000 - $85,000</option>
                                <option>$85,000 - $100,000</option>
                                <option>$100,000+</option>
                                <option>Prefer to discuss</option>
                            </select>
                        </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Application Materials</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cover">Cover letter:</label>
                            <textarea required id="cover" name="cover" rows="5" cols="60"
                                placeholder="Tell us why you're interested in working at TechStart and what makes you a great fit for this role..."></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hear">How did you hear about us?</label>
                            <select id="hear" name="hear">
                                <option value="">-- Select Option --</option>
                                <option>Company website</option>
                                <option>LinkedIn</option>
                                <option>Social media</option>
                                <option>Friend/colleague referral</option>
                                <option>Recruiter</option>
                                <option>Career fair</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>


                    <div class="form-row">
                        <div class="form-group">
                            <label for="comments">Additional comments:</label>
                            <textarea id="comments" name="comments" rows="3" cols="60"
                                placeholder="Any additional information you'd like to share..."></textarea>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit">Submit Application</button>
                        <button type="reset">Clear Form</button>
                        <input required type="checkbox" id="terms" name="terms">
                        <label for="terms">I agree to the terms and conditions</label>
                    </div>


                </fieldset>


            </form>
        </div>
    </main>

</body>

</html>
